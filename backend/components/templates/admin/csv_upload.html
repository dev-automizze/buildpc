{% extends "admin/base_site.html" %}

{% block content %}
<div style="margin-top: 20px;">
    <h2>Upload Component CSV Data</h2>
    <form action="." method="POST" enctype="multipart/form-data" style="margin-top: 20px; padding: 20px; background: #2c2c2c; border-radius: 5px;">
        {% csrf_token %}
        
        <label style="color: white; display: block; margin-bottom: 5px;">Select Component Type:</label>
        <select name="component_type" required style="margin-bottom: 20px; padding: 5px; width: 200px;">
            <option value="CPU">CPU</option>
            <option value="Motherboard">Motherboard</option>
        </select>
        <br>

        <input type="file" name="csv_file" required style="margin-bottom: 20px; color: white;">
        <br>
        <button type="submit" style="background-color: #417690; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer;">
            Upload & Process
        </button>
    </form>
</div>
{% endblock %}
